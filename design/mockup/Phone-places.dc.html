  }
  renderVals() {
    const { ticked, toast } = this.state;
    const base = [
      { name: 'Silviculture: general principles', state: 'fresh', fill: '92%', label: 'Fresh till 4 Dec' },
      { name: 'Silvicultural systems', state: 'fresh', fill: '70%', label: 'Fresh till 18 Nov' },
      { name: 'Mangroves and cold deserts', state: 'fading', fill: '30%', label: 'Recall today' },
      { name: 'Silviculture of trees', state: 'new' },
      { name: 'Agroforestry, social forestry and JFM', state: 'fresh', fill: '76%', label: 'Fresh till 21 Nov' },
      { name: 'Forest soils and watershed management', state: 'fading', fill: '38%', label: 'Recall tomorrow' },
      { name: 'Tree improvement and seed technology', state: 'new' }
    ];
    const topics = base.map((t, i) => {
      const justTicked = t.state === 'new' && !!ticked[i];
      const done = t.state !== 'new' || justTicked;
      const state = justTicked ? 'fresh' : t.state;
      return {
        name: t.name, rule: i === 0 ? 'transparent' : '#222632',
        pressed: done ? 'true' : 'false', aria: (done ? 'Studied: ' : 'Tick as studied: ') + t.name,
        boxLine: done ? '#8E97FF' : '#4A5062', boxBg: done ? '#8E97FF' : 'transparent', tick: done ? 1 : 0,
        fill: justTicked ? '100%' : t.fill || '0%',
        color: state === 'fading' ? '#F2B866' : '#8E97FF',
        label: justTicked ? 'Fresh · recall Monday' : t.label || 'Not started',
        labelColor: state === 'fading' ? '#F2B866' : state === 'new' ? '#8A90A2' : '#A9AEBD',
        toggle: () => { if (t.state === 'new') this.setState({ ticked: { ...ticked, [i]: !ticked[i] }, toast: !ticked[i] }); }
      };
    });
    return { topics, toast, undo: () => this.setState({ ticked: {}, toast: false }) };
  }
}
</script>
