<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; color: #F2B866">Forestry · Silvicultural systems</div><h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance">This one keeps slipping</h1><div style="color: #A9AEBD"><span style="color: #ECEEF4">The regeneration period: from seeding felling to final felling.</span> Missed four of the last five times. Repeating it the same way is not working.</div></div><div style="display: flex; flex-direction: column; gap: 10px"><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Reread the source</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">Khanna, chapter 7. It comes back two days after you say you have.</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Split it in two</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">“What starts the regeneration period?” and “What ends it?”</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Turn it into a diagram</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">A timeline of the four fellings, drawn by you, becomes the prompt.</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Make a memory hook</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">One line of your own that gets shown first.</span></button></div><button type="button" class="pd-press" style="min-height: 48px; border-radius: 14px; border: 0; background: transparent; color: #9BA3FF; font-weight: 500; font-size: 15px">Leave it as it is</button>

ight: 79%; border-radius: 4px 4px 0 0; background: #F2B866"></div><div style="flex: 1 1 0; height: 84%; border-radius: 4px 4px 0 0; background: #F2B866"></div><div style="flex: 1 1 0; height: 88%; border-radius: 4px 4px 0 0; background: #F2B866"></div></div><div style="font-size: 12px; color: #8A90A2">Recall minutes a day over the next three weeks. The dashed line is your 2 hours.</div></div><div style="display: flex; flex-direction: column; gap: 10px"><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Tick 4 now, the rest next week</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">Keeps every day inside 2 hours. The app will remind you once.</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Rest 14 easy items</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">Right five times running and rarely asked. They return in the final month.</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color: #ECEEF4"><span style="font-weight: 600">Allow 2 h 30 min a day</span><span style="font-size: 13px; color: #A9AEBD; line-height: 1.4">Your number. Change it back whenever you like.</span></button><button type="button" class="pd-opt" aria-pressed="false" style="text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; border: 1px solid #262B38; background: #171A23; color:
